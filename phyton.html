<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Tabelas PDF para HTML</title>
    
    <!-- Importa o PyScript para rodar Python no navegador -->
    <link rel="stylesheet" href="https://pyscript.net">
    <script type="module" src="https://pyscript.net"></script>

    <!-- Estilização básica para as tabelas extraídas ficarem organizadas -->
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 30px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        #output { margin-top: 20px; }
        .table-title { font-weight: bold; margin-top: 15px; color: #333; }
    </style>
</head>
<body>

    <h2>Conversor de Tabelas de PDF para HTML</h2>
    <p>Selecione um PDF contendo tabelas para renderizá-las diretamente na página.</p>
    
    <input type="file" id="pdf-file" accept=".pdf">
    
    <div id="output">As tabelas extraídas aparecerão aqui...</div>

    <!-- Configuração: Instala o pdfplumber e suas dependências no navegador -->
    <py-config>
        packages = ["pdfplumber", "pypdf"]
    </py-config>

    <script type="py">
        import io
        import pdfplumber
        from pyscript import document
        from pyodide.ffi import create_proxy

        async def process_file(event):
            file_list = event.target.files
            if not file_list:
                return
            
            output_div = document.getElementById("output")
            output_div.innerHTML = "<em>Processando tabelas do PDF... Por favor, aguarde.</em>"
            
            file = file_list.item(0)
            array_buffer = await file.arrayBuffer()
            file_bytes = array_buffer.to_py()
            
            # Abre o PDF na memória usando bytes
            pdf_file = io.BytesIO(file_bytes)
            html_content = ""
            table_count = 0
            
            with pdfplumber.open(pdf_file) as pdf:
                # Percorre cada página do arquivo PDF
                for page_num, page in enumerate(pdf.pages, start=1):
                    # Extrai as tabelas detectadas na página atual
                    tables = page.extract_tables()
                    
                    for table in tables:
                        table_count += 1
                        html_content += f"<div class='table-title'>Tabela {table_count} (Página {page_num})</div>"
                        html_content += "<table>"
                        
                        # Monta as linhas (rows) e células (cells) em elementos HTML
                        for r_idx, row in enumerate(table):
                            html_content += "<tr>"
                            for cell in row:
                                # Trata valores nulos/vazios e limpa quebras de linha internas
                                text = str(cell).replace('\n', ' ') if cell is not None else ""
                                
                                # Define se é uma linha de cabeçalho ou célula comum
                                if r_idx == 0:
                                    html_content += f"<th>{text}</th>"
                                else:
                                    html_content += f"<td>{text}</td>"
                            html_content += "</tr>"
                        
                        html_content += "</table>"
            
            # Se nenhuma tabela foi encontrada no PDF
            if table_count == 0:
                output_div.innerHTML = "<p style='color: red;'>Nenhuma tabela estruturada foi detectada neste PDF.</p>"
            else:
                output_div.innerHTML = html_content

        # Vincula o evento do botão de upload ao script Python
        upload_element = document.getElementById("pdf-file")
        upload_element.addEventListener("change", create_proxy(process_file))
    </script>

</body>
</html>
