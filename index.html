<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Usuários</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-color: #f4f4f9; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 900px; }
        
        form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; display: flex; flex-direction: column; height: fit-content; }
        input { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        button { padding: 10px; background-color: #00684a; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #004d36; }
        .btn-cancelar { background-color: #6c757d; margin-top: 5px; display: none; }
        .btn-cancelar:hover { background-color: #5a6268; }

        .list-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 320px; max-height: 500px; overflow-y: auto; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: #00684a; color: white; }
        
        .acoes { display: flex; gap: 5px; }
        .btn-editar { background-color: #ffc107; color: black; padding: 5px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-deletar { background-color: #dc3545; color: white; padding: 5px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Formulário apontando para a URL completa do Render -->
        <form id="form-usuario" action="https://suriano-github-io.onrender.com/salvar" method="POST">
            <h2 id="titulo-form">Cadastrarrr Usuário</h2>
            
            <input type="hidden" id="usuario-id" name="id">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite o nome">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required placeholder="Digite a senha">

            <button type="submit" id="btn-salvar">Salvar no Banco</button>
            <button type="button" id="btn-cancelar" class="btn-cancelar" onclick="limparFormulario()">Cancelar Edição</button>
        </form>

        <!-- Área da Listagem -->
        <div class="list-container">
            <h2>Usuários Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-usuarios">
                    <tr><td colspan="2">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // URL base do seu backend no Render
        const API_URL = 'https://suriano-github-io.onrender.com';

        // Função para buscar os dados do servidor e preencher a tabela (READ)
        async function carregarUsuarios() {
            try {
                const resposta = await fetch(`${API_URL}/usuarios`);
                const usuarios = await resposta.json();
                
                const tabelaElemento = document.getElementById('tabela-usuarios');
                tabelaElemento.innerHTML = '';

                if (usuarios.length === 0) {
                    tabelaElemento.innerHTML = '<tr><td colspan="2">Nenhum usuário cadastrado.</td></tr>';
                    return;
                }

                usuarios.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.nome}</td>
                        <td class="acoes">
                            <button type="button" class="btn-editar" onclick="prepararEdicao('${user._id}', '${user.nome}')">Editar</button>
                            <form action="${API_URL}/deletar/${user._id}" method="POST" style="display:inline; margin:0; padding:0; background:none; box-shadow:none; width:auto;">
                                <button type="submit" class="btn-deletar" onclick="return confirm('Deseja realmente excluir?')">Excluir</button>
                            </form>
                        </td>
                    `;
                    tabelaElemento.appendChild(tr);
                });
            } catch (error) {
                console.error('Erro ao carregar usuários:', error);
                document.getElementById('tabela-usuarios').innerHTML = '<tr><td colspan="2">Erro ao carregar dados. Verifique a conexão.</td></tr>';
            }
        }

        // Preenche o formulário para edição (UPDATE)
        async function prepararEdicao(id, nomeAtual) {
            document.getElementById('usuario-id').value = id;
            document.getElementById('nome').value = nomeAtual;
            document.getElementById('senha').value = '';
            document.getElementById('senha').placeholder = 'Digite nova senha (ou mantenha)';
            
            document.getElementById('titulo-form').textContent = 'Editar Usuário';
            document.getElementById('btn-salvar').textContent = 'Atualizar';
            document.getElementById('btn-cancelar').style.display = 'block';
        }

        // Reseta o formulário para o modo de cadastro normal
        function limparFormulario() {
            document.getElementById('usuario-id').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('senha').value = '';
            document.getElementById('senha').placeholder = 'Digite a senha';
            
            document.getElementById('titulo-form').textContent = 'Cadastrar Usuário';
            document.getElementById('btn-salvar').textContent = 'Salvar no Banco';
            document.getElementById('btn-cancelar').style.display = 'none';
        }

        // Executa a listagem ao carregar a página
        carregarUsuarios();
    </script>

</body>
</html>
