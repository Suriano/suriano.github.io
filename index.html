<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; display: flex; flex-direction: column; }
        input { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background-color: #00684a; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #004d36; }
    </style>
</head>
<body>

    <!-- O formulário envia os dados via POST para a rota /cadastrar do servidor -->

      <!-- Correto -->
<form action="https://suriano-github-io.onrender.com/cadastrar" method="POST">
        <h2>Cadastrar Usuário</h2>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required placeholder="Digite o nome">

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required placeholder="Digite a senha">

        <button type="submit">Salvar no Banco</button>
    </form>

</body>
</html>
