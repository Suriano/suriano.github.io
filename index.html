<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Usuários - Suriano.dev</title>
    <!-- Importação de fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 25px;
            text-align: center;
            width: 100%;
            max-width: 950px;
        }

        /* Estilo para a imagem no topo */
        .banner-topo {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            display: block;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 950px;
        }
        
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
            height: fit-content;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            margin-bottom: 16px;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: #f8fafc;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-cancelar {
            background-color: #64748b;
            margin-top: 8px;
            display: none;
        }
        
        .btn-cancelar:hover {
            background-color: #475569;
        }

        .list-container {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            flex: 1;
            min-width: 320px;
            max-height: 520px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .list-container h2 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-main);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:hover td {
            background-color: #f8fafc;
        }
        
        .acoes {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .btn-editar, .btn-deletar {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            width: auto;
            transition: opacity 0.2s;
        }

        .btn-editar {
            background-color: #fef3c7;
            color: #d97706;
        }
        .btn-editar:hover {
            opacity: 0.8;
            background-color: #fef3c7;
        }

        .btn-deletar {
            background-color: #fee2e2;
            color: #dc2626;
        }
        .btn-deletar:hover {
            opacity: 0.8;
            background-color: #fee2e2;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <!-- Insira o nome do arquivo da imagem no atributo src -->
        <img src="banner.jpg" alt="Suriano.dev Banner" class="banner-topo">
    </header>

    <div class="container">
        <!-- Formulário Dinâmico -->
        <form id="form-usuario" class="card" action="https://suriano-github-io.onrender.com/salvar" method="POST">
            <h2 id="titulo-form">Novo Usuário</h2>
            
            <input type="hidden" id="usuario-id" name="id">

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite o nome">

            <label for="senha">Senha de Acesso</label>
            <input type="password" id="senha" name="senha" required placeholder="Digite a senha">

            <button type="submit" id="btn-salvar">Salvar no Banco</button>
            <button type="button" id="btn-cancelar" class="btn-cancelar" onclick="limparFormulario()">Cancelar</button>
        </form>

        <!-- Área da Listagem -->
        <div class="list-container">
            <h2>Usuários Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th style="text-align: right;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-usuarios">
                    <tr><td colspan="2" class="empty-state">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'https://suriano-github-io.onrender.com';

        async function carregarUsuarios() {
            try {
                const resposta = await fetch(`${API_URL}/usuarios`);
                const usuarios = await resposta.json();
                
                const tabelaElemento = document.getElementById('tabela-usuarios');
                tabelaElemento.innerHTML = '';

                if (usuarios.length === 0) {
                    tabelaElemento.innerHTML = '<tr><td colspan="2" class="empty-state">Nenhum usuário cadastrado.</td></tr>';
                    return;
                }

                usuarios.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${user.nome}</strong></td>
                        <td class="acoes">
                            <button type="button" class="btn-editar" onclick="prepararEdicao('${user._id}', '${user.nome}')">Editar</button>
                            <form action="${API_URL}/deletar/${user._id}" method="POST" style="display:inline; margin:0; padding:0; background:none; box-shadow:none; width:auto;">
                                <button type="submit" class="btn-deletar" onclick="return confirm('Deseja realmente excluir este usuário?')">Excluir</button>
                            </form>
                        </td>
                    `;
                    tabelaElemento.appendChild(tr);
                });
            } catch (error) {
                console.error('Erro ao carregar usuários:', error);
                document.getElementById('tabela-usuarios').innerHTML = '<tr><td colspan="2" class="empty-state" style="color: #dc2626;">Erro ao conectar com o servidor.</td></tr>';
            }
        }

        async function prepararEdicao(id, nomeAtual) {
            document.getElementById('usuario-id').value = id;
            document.getElementById('nome').value = nomeAtual;
            document.getElementById('senha').value = '';
            document.getElementById('senha').placeholder = 'Nova senha (opcional)';
            
            document.getElementById('titulo-form').textContent = 'Editar Usuário';
            document.getElementById('btn-salvar').textContent = 'Atualizar Dados';
            document.getElementById('btn-cancelar').style.display = 'block';
        }

        // Reseta o formulário para o modo de cadastro normal
        function limparFormulario() {
            document.getElementById('usuario-id').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('senha').value = '';
            document.getElementById('senha').placeholder = 'Digite a senha';
            
            document.getElementById('titulo-form').textContent = 'Novo Usuário';
            document.getElementById('btn-salvar').textContent = 'Salvar no Banco';
            document.getElementById('btn-cancelar').style.display = 'none';
        }

        carregarUsuarios();
    </script>

</body>
</html>
