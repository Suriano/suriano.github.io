<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo CKEditor</title>
    <!-- Inclusão do CKEditor via CDN (versão 4 LTS) -->
    <script src="https://ckeditor.com"></script>
</head>
<body>

    <h1>Meu Editor de Texto</h1>
    
    <!-- Textarea que será transformado em editor -->
    <textarea name="editor1" id="editor1"></textarea>

    <script>
        // Ativa o CKEditor no textarea com o id 'editor1'
        CKEDITOR.replace('editor1');
    </script>

</body>
</html>
