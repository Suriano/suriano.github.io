            background-color: #0056b3;

        }

        }

            text-align: center;
            color: #777;
            font-style: italic;
            padding: 20px;
        }
        .top-filter {
            margin-top: 15px;
            padding: 15px;
            background-color: #eef2f7;
            border-radius: 6px;
            border: 1px solid #d1d9e0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            display: none;
        }
        .filter-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .top-filter label {
            font-weight: bold;
        }
        .top-filter select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .whatsapp-output-top {
            background-color: #f9f9f9;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 15px;
            margin-bottom: 10px;
            display: none;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe57;
        }
        .btn-copy {
            background-color: #0056b3;
        }
        .btn-copy:hover {
            background-color: #004494;
        }
    </style>
</head>

    const fileInput = document.getElementById('pdfFile');
    const tableContainer = document.getElementById('table-container');
    const filterSection = document.getElementById('filter-section');
    const selectDia = document.getElementById('selectDia');
    const selectTurno = document.getElementById('selectTurno');
    const whatsappBoxTop = document.getElementById('whatsappBoxTop');
    const actionButtons = document.getElementById('actionButtons');
    const btnWhatsAppLink = document.getElementById('btnWhatsAppLink');
    const btnCopy = document.getElementById('btnCopy');

    window.addEventListener('beforeunload', () => {
        fileInput.value = '';
    });

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        
        if (!file) {
            tableContainer.innerHTML = '<p class="empty-message">Nenhum arquivo selecionado ou dados carregados.</p>';
            filterSection.style.display = 'none';
            whatsappBoxTop.style.display = 'none';
            actionButtons.style.display = 'none';
            return;
        }

        filterSection.style.display = 'flex';

        const diasUnicos = [...new Set(dadosMesCompleto.map(item => item.dia))];
        selectDia.innerHTML = '<option value="">Selecione o dia...</option>';
        diasUnicos.forEach(dia => {
            const opt = document.createElement('option');
            opt.value = dia;
            opt.textContent = `Dia ${dia}`;
            selectDia.appendChild(opt);
        });

        renderizarTabela(dadosMesCompleto);
    });

    function renderizarTabela(dados) {
        const dadosOrdenados = [...dados].sort((a, b) => a.dia - b.dia);

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Dia</th>
                        <th>Semana</th>
                        <th>Estação</th>
                        <th>AISP</th>
                        <th>07h às 15h</th>
                        <th>15h às 23h</th>
                    </tr>
                </thead>
                <tbody>
        `;

        dadosOrdenados.forEach(item => {
            html += `
                <tr>
                    <td><strong>${item.dia}</strong></td>
                    <td>${item.semana}</td>
                    <td>${item.estacao}</td>
                    <td>${item.aisp}</td>
                    <td>${item.t07_15}</td>
                    <td>${item.t15_23}</td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>
        `;

        tableContainer.innerHTML = html;
    }

    function atualizarFiltroRodape() {
        const diaSelecionado = selectDia.value;
        const turnoSelecionado = selectTurno.value;

        if (!diaSelecionado || !turnoSelecionado) {
            whatsappBoxTop.style.display = 'none';
            actionButtons.style.display = 'none';
            return; 
        }

        const dadosFiltrados = dadosMesCompleto.filter(item => item.dia == diaSelecionado);

        let html = `
            <h3>Escala para o Dia ${diaSelecionado} (${dadosFiltrados[0] ? dadosFiltrados[0].semana : ''}) - Turno: ${turnoSelecionado === 't07_15' ? '07h às 15h' : '15h às 23h'}</h3>
            <table>
                <thead>
                    <tr>
                        <th>Dia</th>
                        <th>Semana</th>
                        <th>Estação</th>
                        <th>AISP</th>
                        <th>${turnoSelecionado === 't07_15' ? '07h às 15h' : '15h às 23h'}</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let textoWhatsApp = `Escala - Dia ${diaSelecionado} (${turnoSelecionado === 't07_15' ? '07h às 15h' : '15h às 23h'}):\n\n`;

        dadosFiltrados.forEach((item, index) => {
            const idEscala = item[turnoSelecionado];
            html += `
                <tr>
                    <td><strong>${item.dia}</strong></td>
                    <td>${item.semana}</td>
                    <td>${item.estacao}</td>
                    <td>${item.aisp}</td>
                    <td><strong>${idEscala}</strong></td>
                </tr>
            `;
            
            textoWhatsApp += `https://sistemasadmin.intranet.policiamilitar.sp.gov.br/escala/arrelpreesc.aspx?${idEscala}\n🚆 ${item.estacao}`;
            
            if (index < dadosFiltrados.length - 1) {
                textoWhatsApp += `\n\n`;
            }
        });

        html += `
                </tbody>
            </table>
        `;

        tableContainer.innerHTML = html;

        whatsappBoxTop.style.display = 'block';
        whatsappBoxTop.textContent = textoWhatsApp;
        
        actionButtons.style.display = 'flex';
        btnWhatsAppLink.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoWhatsApp)}`;
    }

    // Funcionalidade robusta do botão Copiar Texto (Compatível com WebViews e Dispositivos Móveis)
    btnCopy.addEventListener('click', function() {
        const textoParaCopiar = whatsappBoxTop.textContent;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textoParaCopiar).then(() => {
                mostrarSucessoCopia();
            }).catch(() => {
                executarCopiaAlternativa(textoParaCopiar);
            });
        } else {
            executarCopiaAlternativa(textoParaCopiar);
        }
    });

    function executarCopiaAlternativa(texto) {
        const textarea = document.createElement('textarea');
        textarea.value = texto;
        textarea.style.position = 'fixed'; // Evita rolagem da página
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        
        try {
            const sucesso = document.execCommand('copy');
            if (sucesso) {
                mostrarSucessoCopia();
            } else {
                alert('Não foi possível copiar o texto automaticamente.');
            }
        } catch (err) {
            alert('Erro ao copiar texto: ' + err);
        }
        
        document.body.removeChild(textarea);
    }

    function mostrarSucessoCopia() {
        btnCopy.textContent = '✅ Copiado!';
        setTimeout(() => {
            btnCopy.textContent = '📋 Copiar Texto';
        }, 2000);
    }

    selectDia.addEventListener('change', atualizarFiltroRodape);
    selectTurno.addEventListener('change', atualizarFiltroRodape);
