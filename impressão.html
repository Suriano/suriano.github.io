<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página com Brasão Exato</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
        }
        /* Estilo para garantir que a imagem SVG apareça corretamente */
        .meu-brasao {
            width: 200px; /* Ajuste o tamanho aqui */
            height: auto;
            margin-bottom: 30px;
            display: block; /* Remove espaços indesejados abaixo da imagem */
            margin-left: auto;
            margin-right: auto;
        }
        .btn {
            display: inline-block;
            background-color: #007BFF;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- A tag <img> agora carrega o arquivo SVG que você baixou -->
        <img src="Coat_of_arms_of_São_Paulo_State.svg" alt="Brasão de São Paulo" class="meu-brasao">

        <!-- Botão -->
        <a href="https://Suriano.github.io/teste.html" target="_blank" class="btn">Abrir Página Suriano</a>
    </div>

</body>
</html>
