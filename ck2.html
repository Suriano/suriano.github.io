<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo Quill.js</title>
    <!-- Inclui o estilo CSS do Quill -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
</head>
<body>

    <h1>Meu Editor de Texto</h1>
    
    <!-- Cria a div que vai virar o editor -->
    <div id="editor" style="height: 200px;">
        <p>Olá, mundo! Digite algo aqui...</p>
    </div>

    <!-- Inclui o script JS do Quill -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script>
        // Inicializa o Quill na div com o id "editor"
        const quill = new Quill('#editor', {
            theme: 'snow' // Tema padrão com barra de ferramentas
        });
    </script>
</body>
</html>
