<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo CKEditor</title>
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/48.4.0/ckeditor5.css" />
</head>
<body>
    <textarea name="conteudo" id="editor">Texto inicial...</textarea>

    <script src="https://cdn.ckeditor.com/ckeditor5/48.4.0/ckeditor5.umd.js"></script>
    <script>
        const { ClassicEditor, Essentials, Paragraph, Bold, Italic } = CKEDITOR;

        ClassicEditor
            .create(document.querySelector('#editor'), {
                licenseKey: 'GPL', // ou sua chave de licença
                plugins: [Essentials, Paragraph, Bold, Italic],
                toolbar: ['bold', 'italic']
            })
            .catch(error => {
                console.error(error);
            });
    </script>
</body>
</html>
