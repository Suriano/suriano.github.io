<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Exemplo CKEditor 4 - Full Preset</title>
    <!-- Carrega o CKEditor 4 Full via CDN -->
    <script src="https://ckeditor.com"></script>
</head>
<body>
    <form>
        <textarea name="editor1" id="editor1" rows="10" cols="80">
            Este é um texto inicial no <strong>CKEditor 4</strong> (Full Preset).
        </textarea>
        <script>
            // Substitui o textarea pelo editor completo
            CKEDITOR.replace('editor1', {
                height: 400
            });
        </script>
    </form>
</body>
</html>
